[build]
installCommand = "npm install --legacy-peer-deps --include=optional && npx puppeteer browsers install chrome"
buildCommand = "npm run build && mkdir -p .next/standalone/.next/static && cp -r .next/static/. .next/standalone/.next/static/ && cp -r public .next/standalone/public"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 PORT=${PORT:-3000} node .next/standalone/server.js"
