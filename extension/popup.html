<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
    .status {
      display: flex;
      items-center: center;
      gap: 8px;
      margin-top: 12px;
      font-weight: bold;
      font-size: 11px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <h1>Verytis Sync</h1>
  <p>Cette extension synchronise votre session LinkedIn avec le moteur de recrutement VerytisHR.</p>
  <div class="status">
    <div class="status-dot"></div>
    Extension Active
  </div>
</body>
</html>
